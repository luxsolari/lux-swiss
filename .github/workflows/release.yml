name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish a release for, e.g. v0.6.2"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        run: python3 scripts/extract_changelog.py "${{ steps.resolve.outputs.tag }}" > release_notes.md

      - name: Build public native plugin archive
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          python3 -c 'import json, os; from pathlib import Path; version = json.loads(Path(".claude-plugin/plugin.json").read_text())["version"]; assert os.environ["RELEASE_TAG"] == "v" + version, "Release tag and plugin version differ"'
          python3 scripts/test_package_plugin.py
          python3 scripts/package_plugin.py

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes-file release_notes.md
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes-file release_notes.md
          fi
          gh release upload "$TAG" dist/lux-visual-systems-lux-swiss-plugin-*.zip dist/lux-visual-systems-lux-swiss-plugin-*.zip.sha256 --repo "${{ github.repository }}" --clobber
